[project]
name = "rigid"
version = "0.1.0"
description = "RIGID training-free AI-generated image detection"
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.5.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "remotezip>=0.12.6",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
    "ruff>=0.17.4",
]

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check ."

[tool.poe.tasks.clean]
sequence = ["format", "lint"]
