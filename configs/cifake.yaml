# RIGID evaluation on CIFAKE (Kaggle). Run:
#   uv run python scripts/evaluate.py --config configs/cifake.yaml

# --- method ---
THRESHOLD: 0.95            # similarity >= THRESHOLD -> real, below -> AI-generated
N_NOISE: 1                 # noise draws averaged per image (1 = same as the IBM notebook)
LAMB: 0.05                 # noise intensity (paper default)
MODEL_NAME: dinov2_vitl14  # dinov2_vits14 | dinov2_vitb14 | dinov2_vitl14 | dinov2_vitg14

# --- data ---
DATASET_NAME: cifake       # key in utils/datasets.py DATASETS
SPLIT: test                # cifake: test | train
MAX_IMAGES_PER_CLASS: 1000 # null = use every image (cifake test = 10k real + 10k fake)
DATA_ROOT: dataset/image   # paths under this root follow the repository dataset hierarchy
DOWNLOAD_DIR: null         # Kaggle cache folder; null = ~/.cache/kagglehub

# --- runtime ---
BATCH_SIZE: 64
NUM_WORKERS: 2
DEVICE: null               # null = auto (cuda > mps > cpu)
SEED: 100
OUTPUT_DIR: results
